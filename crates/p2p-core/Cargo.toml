[package]
name = "p2p-core"
version = "0.1.0"
edition = "2021"
description = "Core P2P Decentralized Engine (Identity, DHT, QUIC, GossipSub, Audio)"

[dependencies]
# Redes P2P oficiais com todas as features de transporte
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "kad",
    "identify",
    "ping",
    "dcutr",
    "relay",
    "autonat",
    "quic",
    "tcp",
    "dns",
    "rsa", # nós de bootstrap da DHT Amino (IDs "Qm...") usam chaves RSA
    "noise",
    "yamux",
    "mdns",
    "macros",
    "request-response"
] }

# Criptografia e Identidade (Ed25519)
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
sha2 = "0.10"

# Assíncrono e Utilidades
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Áudio Nativo Multiplataforma (Windows WASAPI, Linux ALSA, macOS CoreAudio)
cpal = "0.15"
opus1 = "0.3.0"
jpeg-encoder = "0.7.1"
image = "0.25.10"
openh264 = "0.9.9"
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
async-trait = "0.1"
postcard = { version = "1.1", features = ["alloc"] }
serde_bytes = "0.11"

# Captura de tela nativa só existe em desktop; Android/iOS entregam frames pelo app hospedeiro
# (screen::capture::external)
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }

[dev-dependencies]
tokio-test = "0.4"

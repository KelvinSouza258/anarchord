[package]
name = "p2p-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
p2p-core = { path = "../p2p-core" }
libp2p = { version = "0.54", features = ["tokio", "gossipsub"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rustyline = "14.0"

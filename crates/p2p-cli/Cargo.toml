[package]
name = "p2p-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
p2p-ffi = { path = "../p2p-ffi" }
p2p-core = { path = "../p2p-core" }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
minifb = "0.29.0"
unicode-width = "0.2"

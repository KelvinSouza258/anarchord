[package]
name = "p2p-agent"
version = "0.1.0"
edition = "2021"
description = "Nó Anarchord sem interface, controlado por JSON no stdin/stdout (laboratório de testes, bots)"

[[bin]]
name = "anarchord-agent"
path = "src/main.rs"

[dependencies]
p2p-core = { path = "../p2p-core" }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

networks:
  # Rede privada 1: Simula a LAN da casa de Alice (atrás de NAT)
  nat_alice_lan:
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/24

  # Rede privada 2: Simula a LAN da casa de Bob (atrás de outro NAT isolado)
  nat_bob_lan:
    ipam:
      driver: default
      config:
        - subnet: 192.168.20.0/24

  # Rede pública (Internet WAN): Onde vive o Relay e nós de descoberta pública
  public_wan:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

services:
  # =========================================================================
  # Nó 1: Bootstrap / Mini-DHT Local (100% isolado, sem internet, IP: 172.28.0.10)
  # =========================================================================
  mini_dht_bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchord_bootstrap
    command: [
      "--nick", "Local-Bootstrap",
      "--daemon",
      "--no-auto-bootstrap",
      "--port", "9000",
      "--auto-voice", "geral"
    ]
    networks:
      public_wan:
        ipv4_address: 172.28.0.10
    ports:
      - "9000:9000"

  # =========================================================================
  # Nó 2: Alice (Atrás do NAT A isolado)
  # Transmite áudio Opus sintético + vídeo animado H.264
  # =========================================================================
  peer_alice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchord_alice
    depends_on:
      - mini_dht_bootstrap
    command: [
      "--nick", "Alice",
      "--daemon",
      "--no-auto-bootstrap",
      "--auto-voice", "geral",
      "--synth-audio",
      "--synth-video",
      "--connect", "/ip4/172.28.0.10/tcp/9000"
    ]
    networks:
      - nat_alice_lan
      - public_wan

  # =========================================================================
  # Nó 3: Bob (Atrás do NAT B isolado)
  # Recebe áudio de Alice + vídeo H.264
  # =========================================================================
  peer_bob:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchord_bob
    depends_on:
      - mini_dht_bootstrap
    command: [
      "--nick", "Bob",
      "--daemon",
      "--no-auto-bootstrap",
      "--auto-voice", "geral",
      "--connect", "/ip4/172.28.0.10/tcp/9000"
    ]
    networks:
      - nat_bob_lan
      - public_wan

  # =========================================================================
  # Nó 4: Carol (Terceiro peer para validar 3+ participantes simultâneos)
  # Conectada na mesma sala, recebe e valida áudio e vídeo em multi-peer
  # =========================================================================
  peer_carol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchord_carol
    depends_on:
      - mini_dht_bootstrap
    command: [
      "--nick", "Carol",
      "--daemon",
      "--no-auto-bootstrap",
      "--auto-voice", "geral",
      "--connect", "/ip4/172.28.0.10/tcp/9000"
    ]
    networks:
      - nat_bob_lan
      - public_wan
